<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<title>Workday login</title>
</head>
<body>
<p id="msg">Finishing the Workday login on your computer...</p>
<script>
// Workday only redirects to https. This page forwards the browser to the MCP server on this computer.
// It keeps the path and the query, so the server sees the same request Workday sent here.
var PORT = 8976;
var target = 'http://localhost:' + PORT + location.pathname + location.search;
if (location.search) location.replace(target);
else document.getElementById('msg').textContent = 'This page finishes a Workday login. Start the login from your AI assistant.';
</script>
</body>
</html>
